<svg width="40" height="40" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Определение градиента -->
  <defs>
    <linearGradient id="gradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Закругленный квадрат с градиентом -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#gradient)"/>
  
  <!-- Календарь: основные контуры -->
  <g fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Основной корпус календаря -->
    <rect x="50" y="55" width="100" height="110" rx="10"/>
    
    <!-- Верхние «кольца» крепления -->
    <path d="M 70 55 L 70 35 Q 70 30 75 30 Q 80 30 80 35 L 80 55"/>
    <path d="M 120 55 L 120 35 Q 120 30 125 30 Q 130 30 130 35 L 130 55"/>
    
    <!-- Разделитель заголовка -->
    <line x1="50" y1="85" x2="150" y2="85"/>
  </g>
  
  <!-- Внутренняя сетка: тонкие линии -->
  <g fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Вертикальные разделители сетки -->
    <line x1="83" y1="85" x2="83" y2="165"/>
    <line x1="117" y1="85" x2="117" y2="165"/>
    
    <!-- Горизонтальные линии сетки -->
    <line x1="50" y1="112" x2="150" y2="112"/>
    <line x1="50" y1="138" x2="150" y2="138"/>
  </g>
</svg>