<svg width="40" height="40" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиент остаётся тот же -->
  <defs>
    <linearGradient id="gradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Закруглённый фон -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#gradient)"/>
  
  <!-- Иконка прайс-листа -->
  <g fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Лист документа -->
    <rect x="55" y="50" width="90" height="110" rx="10" ry="10"/>
    
    <!-- Ровные горизонтальные строки (как в таблице цен) -->
    <line x1="70"  y1="75"  x2="130" y2="75"/>
    <line x1="70"  y1="95"  x2="130" y2="95"/>
    <line x1="70"  y1="115" x2="130" y2="115"/>
    <line x1="70"  y1="135" x2="130" y2="135"/>
  </g>
</svg>