<svg width="40" height="40" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Определение градиента -->
  <defs>
    <linearGradient id="gradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Закругленный квадрат с градиентом -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#gradient)"/>
  
  <!-- Знак вопроса -->
  <g fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Верхняя дуга вопроса -->
    <path d="M 65 75 Q 65 50 85 45 Q 110 40 125 55 Q 140 70 130 90 Q 120 105 100 115"/>
    <!-- Вертикальная черта -->
    <line x1="100" y1="115" x2="100" y2="130"/>
    <!-- Точка внизу -->
    <circle cx="100" cy="155" r="10" fill="white" stroke="none"/>
  </g>
</svg>