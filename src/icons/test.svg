<svg class="stars-bg" viewBox="0 0 1200 100" preserveAspectRatio="none">
    <rect width="100%" height="100%" fill="#0a0e1f"/>
    
    <!-- Градиент неба -->
    <defs>
      <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1a2340"/>
        <stop offset="100%" stop-color="#0a0e1f"/>
      </linearGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#sky)"/>
    
    <!-- Звёздочки (можно добавить 30–50 штук) -->
    <circle cx="10%" cy="20%" r="1.2" fill="white" opacity="0.9"/>
    <circle cx="25%" cy="35%" r="0.8" fill="#e0f7ff" opacity="0.7"/>
    <circle cx="40%" cy="15%" r="1" fill="white" opacity="0.95"/>
    <circle cx="55%" cy="60%" r="0.9" fill="white" opacity="0.8"/>
    <circle cx="70%" cy="25%" r="1.1" fill="white" opacity="0.85"/>
    <circle cx="85%" cy="45%" r="0.7" fill="#fff" opacity="0.65"/>
    <!-- ... добавь ещё по вкусу, или генерируй в JS один раз -->
  </svg>
